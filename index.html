<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEZKOR AI ⚡</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#343541;
    color:white;
}

.header{
    background:#202123;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    padding:18px;
}

.chat{
    padding:20px;
    padding-bottom:100px;
}

.message{
    padding:14px;
    border-radius:12px;
    margin-bottom:12px;
    max-width:80%;
}

.ai{
    background:#444654;
}

.user{
    background:#10a37f;
    margin-left:auto;
}

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#202123;
    padding:15px;
    box-sizing:border-box;
    display:flex;
}

input{
    flex:1;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

button{
    margin-left:10px;
    padding:15px 20px;
    border:none;
    border-radius:10px;
    background:#10a37f;
    color:white;
    font-weight:bold;
    font-size:18px;
}
</style>
</head>

<body>

<div class="header">
⚡ TEZKOR AI
</div>

<div class="chat" id="chat">

<div class="message ai">
👋 Salom! Men <b>TEZKOR AI ⚡</b>. Sizga qanday yordam bera olaman?
</div>

</div>

<div class="bottom">

<input id="input" type="text" placeholder="Xabar yozing...">

<button onclick="sendMessage()">➤</button>

</div>

<script>

function sendMessage(){

    let input = document.getElementById("input");
    let chat = document.getElementById("chat");

    let text = input.value.trim();

    if(text === ""){
        return;
    }

    let message = document.createElement("div");

    message.className = "message user";

    message.innerText = text;

    chat.appendChild(message);

    input.value = "";

}

</script>

</body>
</html>
