<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEZKOR AI ⚡</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#343541;
    color:#fff;
    font-family:Arial,sans-serif;
}

.header{
    background:#202123;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.chat{
    height:calc(100vh - 140px);
    overflow-y:auto;
    padding:15px;
}

.message{
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    max-width:80%;
    white-space:pre-wrap;
}

.ai{
    background:#444654;
}

.user{
    background:#10a37f;
    margin-left:auto;
}

.bottom{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    padding:10px;
    background:#202123;
}

input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    margin-left:10px;
    padding:14px 18px;
    border:none;
    border-radius:10px;
    background:#10a37f;
    color:white;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>
  <div class="header">
⚡ TEZKOR AI
</div>

<div id="chat" class="chat">

<div class="message ai">
👋 Salom! Men <b>TEZKOR AI</b>. Sizga qanday yordam bera olaman?
</div>

</div>

<div class="bottom">

<input
id="input"
type="text"
placeholder="Savolingizni yozing...">

<button onclick="sendMessage()">
➤
</button>

</div>

<script>
  async function sendMessage(){

    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    const text = input.value.trim();

    if(!text) return;

    const user = document.createElement("div");
    user.className = "message user";
    user.innerText = text;
    chat.appendChild(user);

    input.value = "";

    const ai = document.createElement("div");
    ai.className = "message ai";
    ai.innerText = "⏳ TEZKOR AI yozmoqda...";
    chat.appendChild(ai);

    try{

        const response = await fetch("/api/chat",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:text
            })
        });

        const data = await response.json();

        if(!response.ok){
            ai.innerText = "❌ " + (data.error || "Xatolik");
            return;
        }

        ai.innerText = data.reply;

    }catch(e){
        ai.innerText = "❌ AI bilan bog'lanishda xatolik.";
    }

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
